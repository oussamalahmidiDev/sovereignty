server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: sovereignty-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: sovereignty-backend
          app: sovereignty-ai
          service_name: sovereignty-ai
          __path__: /var/log/sovereignty/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            thread: thread
            traceId: traceId
            spanId: spanId

      - labels:
          level:
          logger:
          traceId:
          spanId:

      - output:
          source: message
