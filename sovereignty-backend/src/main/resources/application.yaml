server:
  port: 8080
  http2:
    enabled: true
  tomcat:
    max-keep-alive-requests: 1000
    keep-alive-timeout: 60000

spring:
  application:
    name: sovereignty-ai
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:h2:file:./storage/sovereignty_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 2000
      keepalive-time: 30000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sovereignty-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.oussama.sovereignty.domain.model"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-key-for-local-runs}
    ollama:
      base-url: http://localhost:11434
      embedding:
        options:
          model: mxbai-embed-large
      chat:
        model: tinydolphin

sovereignty:
  vector-store:
    provider: internal
    file-path: ./storage/vector-store.json
  storage:
    provider: local
    path: ./storage
  messaging:
    provider: internal
  ai:
    provider: ollama

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,threaddump,heapdump,jfr
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: sovereignty-ai
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

