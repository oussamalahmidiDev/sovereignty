spring:
  datasource:
    url: jdbc:h2:file:./storage/sovereignty_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 2000
      keepalive-time: 30000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true

  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

sovereignty:
  vector-store:
    provider: internal
    file-path: ./storage/vector-store.json
  storage:
    provider: local
    path: ./storage
  messaging:
    provider: internal
  ai:
    provider: ollama
