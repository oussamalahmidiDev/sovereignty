apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovereignty-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: sovereignty.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sovereignty-frontend
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sovereignty-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: sovereignty.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sovereignty-backend
                port:
                  number: 8080

          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: sovereignty-backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: sovereignty-frontend
                port:
                  number: 80