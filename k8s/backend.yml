apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereignty-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereignty-backend
  template:
    metadata:
      labels:
        app: sovereignty-backend
    spec:
      containers:
        - name: backend
          image: sovereignty-ai-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sovereignty-backend-config
            - secretRef:
                name: sovereignty-backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: sovereignty-backend
spec:
  selector:
    app: sovereignty-backend
  ports:
    - port: 8080
      targetPort: 8080