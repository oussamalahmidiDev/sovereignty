apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereignty-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereignty-backend
  template:
    metadata:
      labels:
        app: sovereignty-backend
    spec:
      containers:
        - name: backend
          image: sovereignty-ai-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/sovereignty_ai
            - name: SPRING_DATASOURCE_USERNAME
              value: admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_AI_OLLAMA_BASE_URL
              value: http://host.docker.internal:11434
---
apiVersion: v1
kind: Service
metadata:
  name: sovereignty-backend
spec:
  selector:
    app: sovereignty-backend
  ports:
    - port: 8080
      targetPort: 8080