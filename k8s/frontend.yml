apiVersion: apps/v1
kind: Deployment
metadata:
  name: sovereignty-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sovereignty-frontend
  template:
    metadata:
      labels:
        app: sovereignty-frontend
    spec:
      containers:
        - name: frontend
          image: sovereignty-ai-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sovereignty-frontend
spec:
  type: NodePort
  selector:
    app: sovereignty-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080