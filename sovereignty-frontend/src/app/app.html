<div class="flex flex-col h-screen bg-slate-50 text-slate-900">

  <header class="bg-white border-b p-4 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
      <h1 class="font-bold text-lg tracking-tight">SOVEREIGNTY AI</h1>
    </div>
    <span class="text-xs font-mono text-slate-400">v1.0 - Local Mode</span>
  </header>

  <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
    @for (msg of chatService.messages(); track $index) {
      <div class="flex w-full" [class.justify-end]="msg.isUser">

        <div [class]="msg.isUser
          ? 'bg-indigo-600 text-white rounded-tr-none shadow-indigo-100'
          : 'bg-white text-slate-700 border border-slate-200 rounded-tl-none shadow-sm'"
             class="max-w-[85%] md:max-w-[70%] px-4 py-3 rounded-2xl shadow-md text-sm md:text-base leading-relaxed">

          <p class="whitespace-pre-wrap">{{ msg.message }}</p>

        </div>
      </div>
    }

    @if (chatService.loading()) {
      <div class="flex justify-start">
        <div class="bg-slate-200 text-slate-500 px-4 py-2 rounded-2xl text-sm flex items-center gap-2">
          <span class="flex gap-1">
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce [animation-delay:0.2s]"></span>
            <span class="w-1.5 h-1.5 bg-slate-400 rounded-full animate-bounce [animation-delay:0.4s]"></span>
          </span>
          Thinking...
        </div>
      </div>
    }
  </main>

  <footer class="bg-white border-t p-4">
    <div class="max-w-4xl mx-auto flex items-center gap-3">

      <input #userInput
             (keyup.enter)="onSend(userInput)"
             type="text"
             placeholder="Posez une question sur vos documents..."
             class="flex-1 bg-slate-100 border-none rounded-full px-6 py-3 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400">

      <button (click)="onSend(userInput)"
              [disabled]="chatService.loading()"
              class="bg-indigo-600 text-white p-3 rounded-full hover:bg-indigo-700 transition-all shadow-lg active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
        </svg>
      </button>

    </div>
  </footer>
</div>
